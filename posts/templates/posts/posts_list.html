{% extends 'layout.html' %}

{% block title %}
    Posts List
{% endblock %}

{% block content %}
    <section style="text-align: left;">
    <h1>Posts</h1>
    <ul>

        {% for post in posts %}
            <article class="post">
                <h2>
                    <a href="{%  url 'posts:page' slug=post.slug %}">
                        {{ post.title }}
                    </a>
                </h2>
                <p>{{ post.date }} by {{ post.author}}</p>
                <p>{{ post.body }}</p>
            </article>
        {% endfor %}
    </ul>
    </section>
{% endblock %}
