{% extends 'layout.html' %}

{% block title %}
    {{ post.title }}
{% endblock %}

{% block content %}
    <section style="text-align: left;">
        {% if post.banner %}
            <img
                class="banner"
                src="{{ post.banner.url }}"
                alt="{{ post.title }}"
            />
        {% endif %}
        <h1>{{ post.title }}</h1>
        <p>{{ post.date }}</p>
        <p>{{ post.body }}</p>
    </section>
{% endblock %}
